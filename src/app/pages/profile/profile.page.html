<main class="profile-page">
  <header class="profile-page__header">
    <div class="profile-page__identity">
      <div class="profile-page__avatar">{{ userInitial() }}</div>
      <div class="profile-page__copy">
        <h1>User operations</h1>
        <p>{{ currentUserName() }} · {{ currentUserRole() }}</p>
      </div>
    </div>

    <div class="profile-page__actions">
      <button nz-button nzType="default" (click)="fetchUsers(true, { pageIndex: pageIndex(), pageSize: pageSize() })">
        <span nz-icon nzType="reload"></span>
        Refresh
      </button>
      <button nz-button nzType="default" (click)="logout()">
        <span nz-icon nzType="logout"></span>
        Logout
      </button>
    </div>
  </header>

  <div *ngIf="error()" class="error-banner">
    <span nz-icon nzType="warning"></span>
    <span>{{ error() }}</span>
  </div>

  <ss-table
    [tableConfig]="tableConfig()"
    [columns]="tableColumns()"
    [data]="[]"
    [pageData]="rows()"
    (toolbarAction)="onTableToolbarAction($any($event))"
    (visibleColumnsChange)="onVisibleColumnsChange($any($event))"
    (primaryActionOptionsChange)="onPrimaryActionOptionsChange($event)"
    (actionColumnOptionsChange)="onActionColumnOptionsChange($event)"
    (selectionChange)="onTableSelectionChange($event)"
    (rowClick)="onTableRowClick($event)"
    (pageChange)="onTablePageChange($event)"
    (sortChange)="onTableSortChange($event)"
    (filterChange)="onTableFilterChange($event)"
    (searchChange)="onTableSearchChange($event)"
  ></ss-table>

  <div class="editor-overlay" *ngIf="editorVisible()">
    <section class="editor-panel">
      <header class="editor-header">
        <div>
          <p class="drawer-eyebrow">
            {{ editorMode() === 'detail' ? 'Chi tiết user' : editorMode() === 'edit' ? 'Sửa user' : 'Thêm user' }}
          </p>
          <h2>{{ editorDraft().username || 'User form' }}</h2>
        </div>
        <button nz-button nzType="text" (click)="closeEditor()">
          <span nz-icon nzType="close"></span>
        </button>
      </header>

      <div class="editor-grid">
        <label>
          <span>Username</span>
          <input
            nz-input
            [ngModel]="editorDraft().username"
            (ngModelChange)="updateDraftField('username', $event)"
            [disabled]="editorMode() === 'detail'"
          />
        </label>
        <label>
          <span>Full name</span>
          <input
            nz-input
            [ngModel]="editorDraft().fullName"
            (ngModelChange)="updateDraftField('fullName', $event)"
            [disabled]="editorMode() === 'detail'"
          />
        </label>
        <label>
          <span>Email</span>
          <input
            nz-input
            [ngModel]="editorDraft().email"
            (ngModelChange)="updateDraftField('email', $event)"
            [disabled]="editorMode() === 'detail'"
          />
        </label>
        <label>
          <span>Position</span>
          <input
            nz-input
            [ngModel]="editorDraft().position"
            (ngModelChange)="updateDraftField('position', $event)"
            [disabled]="editorMode() === 'detail'"
          />
        </label>
        <label class="editor-grid__full">
          <span>Roles</span>
          <input
            nz-input
            [ngModel]="editorDraft().roles"
            (ngModelChange)="updateDraftField('roles', $event)"
            [disabled]="editorMode() === 'detail'"
          />
        </label>
      </div>

      <footer class="editor-actions">
        <button nz-button nzType="default" (click)="closeEditor()">Hủy</button>
        <button *ngIf="editorMode() !== 'detail'" nz-button nzType="primary" [nzLoading]="editorLoading()" (click)="saveEditor()">
          Lưu
        </button>
      </footer>
    </section>
  </div>
</main>
